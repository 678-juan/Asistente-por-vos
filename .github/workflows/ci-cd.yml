name: CI-CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ejecutar pruebas unitarias
        run: pytest tests/unit/ -v

  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push a GHCR
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/asistente-recordatorios:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificación post-despliegue (smoke test)
        run: |
          docker run --rm -d --name asistente-recordatorios -p 8000:8000 \
            ghcr.io/${{ github.repository_owner }}/asistente-recordatorios:${{ github.sha }}
          for i in 1 2 3 4 5; do
            curl --fail http://127.0.0.1:8000/salud && break
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/salud
          docker stop asistente-recordatorios
